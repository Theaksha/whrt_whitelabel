{% extends "templates/layout.html" %}

{% block page_content %}
<div class="hero-banner">
  Welcome to SportsJam Lookalike
</div>

<h2 style="text-align:center; padding-top: 2rem;">Featured Products</h2>
<div class="product-grid">
  {% for item in frappe.get_all("Item", fields=["name", "item_name", "route", "image"])[:8] %}
  <a class="product-card" href="/{{ item.route }}">
    <img src="{{ item.image }}" alt="{{ item.item_name }}" style="width: 100%; border-radius: 4px;">
    <h4 style="margin-top: 0.5rem;">{{ item.item_name }}</h4>
  </a>
  {% endfor %}
</div>
{% endblock %}
